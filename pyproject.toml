[project]
name = "research-assistant-rag"
version = "0.1.0"
description = "TinyML Research Assistant: full-text RAG over arXiv papers, LangGraph orchestration, pgvector, FastAPI + MCP server"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # ── PDF ingestion ────────────────────────────────────────────────────────
    "pymupdf>=1.24.0",
    "requests>=2.32.0",
    "httpx>=0.27.0",
    # ── Embeddings / NLP ─────────────────────────────────────────────────────
    "sentence-transformers>=3.0.0",
    "openai>=1.35.0",
    "tiktoken>=0.7.0",
    # ── Database ─────────────────────────────────────────────────────────────
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    # ── LangGraph / LangChain ────────────────────────────────────────────────
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-anthropic>=0.1.0",
    # ── FastAPI ──────────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # ── MCP ──────────────────────────────────────────────────────────────────
    "mcp[cli]>=1.0.0",
    "sse-starlette>=2.1.0",
    # ── Evaluation ───────────────────────────────────────────────────────────
    "ragas>=0.4.3",
    "datasets>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",      # FastAPI TestClient
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "testcontainers[postgres]>=4.7.0",
    "respx>=0.21.0",      # httpx mock
    "types-requests>=2.32.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_assistant"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() pattern

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
# eval/run_eval.py is a manually-triggered integration script (real LLM + DB calls).
# There is no meaningful unit-test path through it; omit rather than artificially pad.
omit = ["*/eval/run_eval.py"]
